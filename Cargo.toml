[package]
name = "crsh"
description = "Crappy Rust SHell. Basic shell written in Rust, not meant to actually be used or taken seriously."
version = "0.0.1"
edition = "2024"
readme = "README.md"
license = "MIT"
homepage = "https://github.com/ndunnett/crsh"
repository = "https://github.com/ndunnett/crsh"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -2 }
cast_possible_truncation = "allow"
missing_errors_doc = "allow"

[dependencies]
ansi-width = "0.1.0"
ariadne = "0.6.0"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
ctrlc = "3.5.2"
derive_more = { version = "2.1.1", features = ["from"] }
homedir = "0.3.6"
itertools = "0.15.0"
os_pipe = "1.2.3"
sysexits = "0.10.0"                                      # newer versions remove TryFrom<i32>

[profile.dev]
lto = "off"
opt-level = 0
panic = "abort"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
